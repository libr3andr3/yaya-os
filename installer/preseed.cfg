# ============================================================
# Yaya OS — preseed del instalador
# Instalación guiada: DISCO COMPLETO + CIFRADO LUKS.
# Solo se pide: idioma, disco destino, passphrase de cifrado.
# (partman-auto/disk NO se preconfigura a propósito -> el usuario
#  elige el disco, así nunca se borra el USB por error.)
# ============================================================

# --- Idioma / teclado / zona (defaults; el instalador deja elegir idioma) ---
d-i debian-installer/locale        string es_PE.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone                      string America/Lima
d-i clock-setup/utc                boolean true
d-i clock-setup/ntp                boolean true

# --- Red ---
d-i netcfg/choose_interface        select auto
d-i netcfg/get_hostname            string yaya
d-i netcfg/get_domain              string local
d-i netcfg/hostname                string yaya

# --- Particionado: GUIADO, DISCO ENTERO, CIFRADO (LUKS + LVM) ---
d-i partman-auto/method            string crypto
d-i partman-auto/choose_recipe     select atomic
d-i partman-auto-lvm/guided_size   string max
d-i partman-lvm/device_remove_lvm  boolean true
d-i partman-md/device_remove_md    boolean true
d-i partman-lvm/confirm            boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-crypto/passphrase-mismatch note
# La passphrase LUKS NO se preconfigura: se pide al usuario (contraseña de arranque)
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition       select finish
d-i partman/confirm                boolean true
d-i partman/confirm_nooverwrite    boolean true
d-i partman-basicfilesystems/no_swap boolean false

# --- Cuenta de usuario (autologin tras descifrado; sudo pide esta clave) ---
d-i passwd/root-login              boolean false
d-i passwd/user-fullname           string Yaya
d-i passwd/username                string yaya
d-i passwd/user-password           password yaya
d-i passwd/user-password-again     password yaya
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home        boolean false

# --- GRUB ---
d-i grub-installer/only_debian     boolean true
d-i grub-installer/bootdev         string default

# --- Sin preguntas de popularidad; reinicio al terminar ---
popularity-contest popularity-contest/participate boolean false
d-i finish-install/reboot_in_progress note

# --- Post-instalación: configurar autologin SOLO en el sistema instalado ---
# (el resto — grub quiet+magenta — ya viene horneado en el squashfs)
d-i preseed/late_command string in-target /usr/local/sbin/yaya-postinstall || true
