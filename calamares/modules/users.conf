# Yaya OS users — Debian-style groups, sudo instead of a root password.
---
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
    - scanner

sudoersGroup: sudo
sudoersConfigureWithGroup: false

# No separate root password — the primary user administers via sudo,
# matching the previous Yaya OS setup.
setRootPassword:  false
doReusePassword:  false

doAutologin:       false
displayAutologin:  true

passwordRequirements:
    minLength: 1
    maxLength: -1

allowWeakPasswords:        true
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location:       EtcFile
    writeHostsFile: true
    template:       "yaya"
    forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
