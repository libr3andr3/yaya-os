# Yaya OS locale — fully interactive, international.
#
# No locale is hard-coded. `region`/`zone` only set where the timezone
# map opens; the user picks their own country/region and language, and
# GeoIP (configured in welcome.conf) pre-positions it when online.
---
region:  "America"
zone:    "New_York"

geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
