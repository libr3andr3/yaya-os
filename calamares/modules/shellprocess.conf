#
# Yaya OS — limpieza post-instalación dentro del sistema INSTALADO.
#   · Quita el lanzador "Install Yaya OS" (escritorio, autostart, menú),
#     el wrapper yaya-install y la regla polkit del live.
#   · Ejecuta yaya-postinstall (GRUB silencioso + timeout, apt sin el medio live).
# Corre después de `bootloader` (GRUB ya instalado) y antes de `removeuser`.
---
dontChroot: false
timeout: 120
script:
    - "rm -f /usr/share/applications/yaya-install.desktop /usr/bin/yaya-install"
    - "rm -f /etc/polkit-1/rules.d/49-yaya-calamares.rules"
    - "rm -f /etc/skel/Desktop/yaya-install.desktop /etc/skel/.config/autostart/yaya-install.desktop"
    - "sh -c 'for h in /home/* /root; do rm -f \"$h/Desktop/yaya-install.desktop\" \"$h/.config/autostart/yaya-install.desktop\"; done'"
    - "sh -c '[ -x /usr/local/sbin/yaya-postinstall ] && /usr/local/sbin/yaya-postinstall || true'"
