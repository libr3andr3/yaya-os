#
# Yaya OS — limpieza post-instalación dentro del sistema INSTALADO.
#   · Quita el lanzador "Install Yaya OS" (escritorio, autostart, menú),
#     el wrapper yaya-install y la regla polkit del live.
#   · Ejecuta yaya-postinstall (GRUB silencioso + timeout, apt sin el medio live).
# Corre después de `bootloader` (GRUB ya instalado) y antes de `removeuser`.
---
dontChroot: false
timeout: 120
script:
    - command: "/usr/local/sbin/yaya-postinstall"
      timeout: 120
