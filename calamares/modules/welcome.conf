# Yaya OS welcome page + install requirements.
# Tuned for refurbished hardware: modest RAM/disk, internet optional.
---
showSupportUrl:      true
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    requiredStorage:   15.0
    requiredRam:       1.0
    internetCheckUrl:  "https://yaya.sh"
    check:    [ storage, ram, power, internet, root, screen ]
    # Only storage/RAM/root actually block installation; the rest warn.
    required: [ storage, ram, root ]

# GeoIP is best-effort: if the live session is online it pre-selects the
# language/region, but the user always confirms it on the locale page.
geoip:
    style:    "json"
    url:      "https://geoip.kde.org/v1/calamares"
    selector: ""
