#
# Yaya OS — display manager: SDDM + Plasma (Wayland) por defecto.
# basicSetup/sysconfigSetup false: la config de SDDM ya la deja
# setup-yaya-plasma.sh en /etc/sddm.conf.d/10-yaya.conf (recordar usuario,
# tema Fluent). Sin autologin: el usuario creado aparece preseleccionado.
---
displaymanagers:
    - sddm

basicSetup:     false
sysconfigSetup: false

defaultDesktopEnvironment:
    executable: "startplasma-wayland"
    desktopFile: "plasma"
