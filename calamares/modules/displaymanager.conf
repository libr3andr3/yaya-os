#
# Yaya OS — display manager: GDM + GNOME (Wayland) por defecto.
# basicSetup/sysconfigSetup false: la marca del greeter ya la deja
# setup-yaya-gnome.sh en /etc/dconf/db/gdm.d (logo alien, tema oscuro,
# cursor). Sin autologin: GDM preselecciona al usuario creado.
---
displaymanagers:
    - gdm

basicSetup:     false
sysconfigSetup: false

defaultDesktopEnvironment:
    executable: "gnome-session"
    desktopFile: "gnome"
