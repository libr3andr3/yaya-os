#
# Yaya OS — display manager: GDM + GNOME (Wayland) por defecto.
# basicSetup/sysconfigSetup false: la config de GDM ya la deja
# setup-yaya-gnome.sh en /etc/gdm3/daemon.conf (Wayland, sin autologin;
# GDM lista los usuarios locales, alien en el greeter).
---
displaymanagers:
    - gdm

basicSetup:     false
sysconfigSetup: false

defaultDesktopEnvironment:
    executable: "gnome-session"
    desktopFile: "gnome"
