#
# Yaya OS — Calamares top-level configuration.
# International, interactive install (locale/keyboard chosen by the user).
---
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess
  - packages
  - removeuser
  - umount
- show:
  - finished

branding: yaya

# Yaya OS partitions real disks — always confirm before the point of no return.
prompt-install: true

dont-chroot: false
oem-setup:   false

disable-cancel:             false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
